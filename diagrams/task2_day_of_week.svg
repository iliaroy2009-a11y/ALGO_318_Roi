<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img">
<title>Блок-схема задачи 2: день недели</title>
<desc>Ввод K, проверка диапазона 1–365, вычисление K % 7 и выбор названия дня недели</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:bold}
.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect,.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray text{fill:#2C2C2A}
.c-purple>rect,.c-purple>polygon{fill:#EEEDFE;stroke:#534AB7}
.c-purple text{fill:#26215C}
.c-teal>rect,.c-teal>polygon{fill:#E1F5EE;stroke:#0F6E56}
.c-teal text{fill:#04342C}
.c-coral>rect,.c-coral>polygon{fill:#FAECE7;stroke:#993C1D}
.c-coral text{fill:#4A1B0C}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#ffffff"/>
<g class="c-gray"><rect x="240" y="20" width="200" height="36" rx="18" stroke-width="0.5"/><text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Начало: TaskDay</text></g>
<line x1="340" y1="56" x2="340" y2="84" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="240" y="84" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="106" text-anchor="middle" dominant-baseline="central">Ввод K</text></g>
<line x1="340" y1="128" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><polygon points="240,188 340,156 440,188 340,220" stroke-width="0.5"/><text class="th" x="340" y="188" text-anchor="middle" dominant-baseline="central">1 ≤ K ≤ 365 ?</text></g>
<line x1="440" y1="188" x2="498" y2="188" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="469" y="178" text-anchor="middle">нет</text>
<g class="c-coral"><rect x="500" y="160" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="575" y="179" text-anchor="middle" dominant-baseline="central">Incorrect input!</text><text class="ts" x="575" y="198" text-anchor="middle" dominant-baseline="central">return, выход</text></g>
<line x1="340" y1="220" x2="340" y2="252" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="240">да</text>
<g class="c-gray"><rect x="240" y="252" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="274" text-anchor="middle" dominant-baseline="central">day = K % 7</text></g>
<line x1="340" y1="296" x2="340" y2="334" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><polygon points="220,366 340,334 460,366 340,398" stroke-width="0.5"/><text class="th" x="340" y="366" text-anchor="middle" dominant-baseline="central">Чему равен day?</text></g>
<line x1="340" y1="398" x2="76" y2="446" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="398" x2="164" y2="446" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="398" x2="252" y2="446" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="398" x2="340" y2="446" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="398" x2="428" y2="446" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="398" x2="516" y2="446" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="398" x2="604" y2="446" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="36" y="450" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="76" y="469" text-anchor="middle" dominant-baseline="central">0</text><text class="ts" x="76" y="488" text-anchor="middle" dominant-baseline="central">Sunday</text></g>
<g class="c-teal"><rect x="124" y="450" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="164" y="469" text-anchor="middle" dominant-baseline="central">1</text><text class="ts" x="164" y="488" text-anchor="middle" dominant-baseline="central">Monday</text></g>
<g class="c-teal"><rect x="212" y="450" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="252" y="469" text-anchor="middle" dominant-baseline="central">2</text><text class="ts" x="252" y="488" text-anchor="middle" dominant-baseline="central">Tuesday</text></g>
<g class="c-teal"><rect x="300" y="450" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="469" text-anchor="middle" dominant-baseline="central">3</text><text class="ts" x="340" y="488" text-anchor="middle" dominant-baseline="central">Wednesday</text></g>
<g class="c-teal"><rect x="388" y="450" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="428" y="469" text-anchor="middle" dominant-baseline="central">4</text><text class="ts" x="428" y="488" text-anchor="middle" dominant-baseline="central">Thursday</text></g>
<g class="c-teal"><rect x="476" y="450" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="516" y="469" text-anchor="middle" dominant-baseline="central">5</text><text class="ts" x="516" y="488" text-anchor="middle" dominant-baseline="central">Friday</text></g>
<g class="c-teal"><rect x="564" y="450" width="80" height="56" rx="8" stroke-width="0.5"/><text class="th" x="604" y="469" text-anchor="middle" dominant-baseline="central">иначе (6)</text><text class="ts" x="604" y="488" text-anchor="middle" dominant-baseline="central">Saturday</text></g>
</svg>
