<svg xmlns="http://www.w3.org/2000/svg" width="680" height="664" viewBox="0 0 680 664" role="img">
<title>Блок-схема задачи 1: тип треугольника</title>
<desc>Ввод трёх сторон, проверка, сортировка и сравнение квадратов сторон для определения типа треугольника</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:bold}
.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect,.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray text{fill:#2C2C2A}
.c-purple>rect,.c-purple>polygon{fill:#EEEDFE;stroke:#534AB7}
.c-purple text{fill:#26215C}
.c-teal>rect,.c-teal>polygon{fill:#E1F5EE;stroke:#0F6E56}
.c-teal text{fill:#04342C}
.c-coral>rect,.c-coral>polygon{fill:#FAECE7;stroke:#993C1D}
.c-coral text{fill:#4A1B0C}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="664" fill="#ffffff"/>
<g class="c-gray"><rect x="120" y="20" width="200" height="36" rx="18" stroke-width="0.5"/><text class="th" x="220" y="38" text-anchor="middle" dominant-baseline="central">Начало: TaskTriangle</text></g>
<line x1="220" y1="56" x2="220" y2="84" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="120" y="84" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="220" y="106" text-anchor="middle" dominant-baseline="central">Ввод a, b, c</text></g>
<line x1="220" y1="128" x2="220" y2="156" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><polygon points="110,188 220,156 330,188 220,220" stroke-width="0.5"/><text class="th" x="220" y="188" text-anchor="middle" dominant-baseline="central">Стороны верны?</text></g>
<line x1="330" y1="188" x2="428" y2="188" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="380" y="178" text-anchor="middle">нет</text>
<g class="c-coral"><rect x="430" y="160" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="520" y="179" text-anchor="middle" dominant-baseline="central">Incorrect input!</text><text class="ts" x="520" y="198" text-anchor="middle" dominant-baseline="central">return, выход</text></g>
<line x1="220" y1="220" x2="220" y2="248" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="238">да</text>
<g class="c-gray"><rect x="120" y="248" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="220" y="270" text-anchor="middle" dominant-baseline="central">Сортировка: a ≤ b ≤ c</text></g>
<line x1="220" y1="292" x2="220" y2="320" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><polygon points="110,352 220,320 330,352 220,384" stroke-width="0.5"/><text class="th" x="220" y="352" text-anchor="middle" dominant-baseline="central">a² + b² = c² ?</text></g>
<line x1="330" y1="352" x2="428" y2="352" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="380" y="342" text-anchor="middle">да</text>
<g class="c-teal"><rect x="430" y="330" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="520" y="352" text-anchor="middle" dominant-baseline="central">Right triangle</text></g>
<line x1="220" y1="384" x2="220" y2="412" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="402">нет</text>
<g class="c-purple"><polygon points="110,444 220,412 330,444 220,476" stroke-width="0.5"/><text class="th" x="220" y="444" text-anchor="middle" dominant-baseline="central">a² + b² &gt; c² ?</text></g>
<line x1="330" y1="444" x2="428" y2="444" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="380" y="434" text-anchor="middle">да</text>
<g class="c-teal"><rect x="430" y="422" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="520" y="444" text-anchor="middle" dominant-baseline="central">Acute triangle</text></g>
<line x1="220" y1="476" x2="220" y2="504" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="494">нет</text>
<g class="c-teal"><rect x="120" y="504" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="220" y="526" text-anchor="middle" dominant-baseline="central">Obtuse triangle</text></g>
<line x1="220" y1="548" x2="220" y2="576" class="arr" marker-end="url(#arrow)"/>
<polyline points="610,352 640,352 640,604 332,604" fill="none" class="arr" marker-end="url(#arrow)"/>
<polyline points="610,444 640,444" fill="none" class="arr"/>
<g class="c-gray"><rect x="110" y="576" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="595" text-anchor="middle" dominant-baseline="central">Следующий треугольник</text><text class="ts" x="220" y="614" text-anchor="middle" dominant-baseline="central">↻ всего 3 раза, затем конец</text></g>
</svg>
